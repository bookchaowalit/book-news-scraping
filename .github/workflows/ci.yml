name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -c "from data_lake import product_store, product_adapter"
      - name: Lint
        run: ruff check .
      - name: Offline unittest suite (fixtures only, no publisher traffic)
        run: python -m unittest discover -s tests -v
      - name: Offline pytest suite (network guard enabled)
        run: python -m pytest -q
