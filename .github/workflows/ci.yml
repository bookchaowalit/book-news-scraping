# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scraper:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      python-version: "3.11" # constraints.txt is the Python 3.11 resolution; the previous CI ran 3.11
      # Same gates as the previous CI: data-lake import check, then both offline suites
      # (fixtures only, no publisher traffic; the pytest suite has a network guard).
      test-command: >-
        python -c "from data_lake import product_store, product_adapter"
        && python -m unittest discover -s tests -v
        && python -m pytest -q

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
